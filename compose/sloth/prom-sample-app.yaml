version: "prometheus/v1"
service: "sample-app"
labels:
  owner: "myteam"
  repo: "myorg/sample-app"
slos:
  # We allow failing (5xx and 429) 1 request every 1000 requests (99.9%).
  - name: "requests-availability"
    objective: 99.9
    description: "Common SLO based on availability for HTTP request responses."
    sli:
      events:
        error_query: sum(rate(http_requests_total{job="sample-app",status=~"(5..|429)"}[{{.window}}]))
        total_query: sum(rate(http_requests_total{job="sample-app"}[{{.window}}]))
    alerting:
      name: SampleAppHighErrorRate
      labels:
        category: "availability"
      annotations:
        # Overwrite default Sloth SLO alert summmary on ticket and page alerts.
        summary: "High error rate on 'sample-app' requests responses"
      page_alert:
        labels:
          severity: pageteam
          routing_key: myteam
      ticket_alert:
        labels:
          severity: "slack"
          slack_channel: "#alerts-myteam"

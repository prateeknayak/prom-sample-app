global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      scheme: http
      timeout: 10s
scrape_configs:
  - job_name: prometheus
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - localhost:9090
    metric_relabel_configs:
      # - source_labels: ["__name__"]
      #   regex: "prom.*_.*"
      #   action: keep
      - source_labels: ["__name__"]
        regex: "^go_.*"
        action: drop
  - job_name: sample-app
    honor_timestamps: true
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - sample-app:8080
    # metric_relabel_configs:
    #   - source_labels: ["__name__"]
    #     regex: "prom.*_.*"
    #     action: keep
    #   - source_labels: ["__name__"]
    #     regex: "^go_.*"
    #     action: drop
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "/etc/prometheus/rules/*.yaml"
